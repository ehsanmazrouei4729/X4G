[package]
name = "Ehsan2nd/x4g"
version = "0.1.0"
description = "X4G FastAPI application"
repository = "https://github.com/x4gpanell/X4G"

[dependencies]
"wasmer/python" = "^3.12.6"

[fs]
"/src" = "."

[[command]]
name = "x4g"
module = "wasmer/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "-m",
    "uvicorn",
    "--app-dir",
    "/src",
    "main:app",
"--host",
    "0.0.0.0",
    "--port",
    "8000"
]

env = [
    "PYTHONEXECUTABLE: /bin/python"
]
