[package]
name = "Ehsan2nd"
version = "0.1.0"
description = "X4G Python FastAPI application"
repository = "https://github.com/x4gpanell/X4G"

[dependencies]
"wasmer/python" = "^3.12.6"

[[command]]
name = "x4g"
module = "wasmer/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "-m",
    "uvicorn",
    "main:app",
    "--host",
    "0.0.0.0",
    "--port",
    "8000"
]
env = ["PYTHONEXECUTABLE: /bin/python"]
